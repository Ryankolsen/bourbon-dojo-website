<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#2A1100"/>

  <!-- Glass body (old fashioned / rocks glass) -->
  <path d="M10 10 L54 10 L47 54 L17 54 Z"
        fill="rgba(180,220,255,0.07)"
        stroke="rgba(240,215,165,0.75)"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Bourbon fill (lower ~42%) -->
  <!-- At y=33: left=10+(17-10)*(33-10)/(54-10)=10+7*23/44≈13.66, right=54-(54-47)*23/44≈50.34 -->
  <path d="M13.7 33 L50.3 33 L47 54 L17 54 Z" fill="#B86208"/>

  <!-- Bourbon warmth layer -->
  <path d="M13.7 33 L50.3 33 L49 40 L15 40 Z" fill="#D4830A" opacity="0.55"/>

  <!-- Bourbon surface shimmer -->
  <line x1="13.7" y1="33" x2="50.3" y2="33"
        stroke="#E89A20" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Ice cube -->
  <rect x="23" y="16" width="18" height="18" rx="3"
        fill="rgba(210,238,255,0.50)"
        stroke="rgba(255,255,255,0.38)"
        stroke-width="1.2"/>
  <!-- Ice facet highlight -->
  <rect x="25.5" y="18.5" width="6" height="3.5" rx="1"
        fill="rgba(255,255,255,0.28)"/>
  <!-- Ice bottom glint -->
  <line x1="24" y1="32" x2="40" y2="32"
        stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Glass left wall sheen -->
  <path d="M10 10 L13.5 10 L20.5 54 L17 54 Z"
        fill="rgba(255,240,200,0.05)"/>

  <!-- Glass rim highlight -->
  <line x1="10" y1="10" x2="54" y2="10"
        stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
</svg>
